<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>开票雷达</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap">
<style>
:root{
  --bg:#eef1f6; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --faint:#94a3b8;
  --line:#e7eaf0; --line2:#eef1f5; --accent:#4f46e5; --accent-soft:#eef2ff; --accent-ink:#4338ca;
  --chip:#f1f5f9; --chip-ink:#334155; --bar:#ffffff; --shadow:0 2px 10px rgba(15,23,42,.06);
  --kr:#2563eb; --hk:#7c3aed; --sea:#059669; --tw:#ea580c;
  --grab:#16a34a; --skip:#94a3b8;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a0e17; --card:#141a27; --ink:#e7ebf3; --muted:#9aa4b7; --faint:#6b7688;
    --line:#232b3b; --line2:#1c2331; --accent:#818cf8; --accent-soft:#20263c; --accent-ink:#c7d0ff;
    --chip:#1c2333; --chip-ink:#c3cbdb; --bar:#111725; --shadow:0 2px 12px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0a0e17; --card:#141a27; --ink:#e7ebf3; --muted:#9aa4b7; --faint:#6b7688;
  --line:#232b3b; --line2:#1c2331; --accent:#818cf8; --accent-soft:#20263c; --accent-ink:#c7d0ff;
  --chip:#1c2333; --chip-ink:#c3cbdb; --bar:#111725; --shadow:0 2px 12px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;}
h1,h2,h3,.disp{font-family:"Sora",-apple-system,"Microsoft YaHei",sans-serif;}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}
/* header (static; scrolls with page so it never covers content) */
.hd{position:static;z-index:20;
  background:linear-gradient(135deg,#111827,#3f34c9);color:#fff;
  padding:calc(16px + env(safe-area-inset-top,0px)) 18px 14px;border-radius:0 0 18px 18px;box-shadow:var(--shadow);}
.hd .t{font:800 21px/1.1 "Sora",sans-serif;display:flex;align-items:center;gap:8px;}
.hd .s{font-size:12px;color:#c7d2fe;margin-top:6px;}
.hd .upd{font-size:11px;color:#a5b4fc;margin-top:3px;}
/* filter bar (static) */
.fb{position:static;z-index:15;background:var(--bg);padding:10px 12px 6px;}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:9px 12px;margin-bottom:9px;box-shadow:var(--shadow);}
.searchbox .si{font-size:15px;opacity:.7;}
.searchbox input{flex:1;border:none;background:transparent;color:var(--ink);font-size:15px;outline:none;}
.searchbox input::placeholder{color:var(--faint);}
.searchbox .sclr{font-size:13px;color:var(--faint);cursor:pointer;padding:2px 4px;}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--chip);color:var(--chip-ink);border:1px solid transparent;
  font-size:13px;font-weight:600;padding:7px 13px;border-radius:20px;cursor:pointer;white-space:nowrap;}
.chip.on{background:var(--accent);color:#fff;}
.togrow{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap;}
.tog{font-size:12px;font-weight:600;color:var(--chip-ink);background:var(--chip);
  padding:6px 11px;border-radius:14px;cursor:pointer;border:1px solid transparent;display:flex;align-items:center;gap:6px;}
.tog.on{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent);}
/* content */
.wrap{flex:1;padding:6px 12px 96px;}
.dateband{font:700 14px/1 "Sora",sans-serif;color:var(--ink);margin:16px 4px 10px;display:flex;align-items:center;gap:8px;}
.dateband .rel{font-size:11px;font-weight:700;color:#fff;background:var(--accent);padding:2px 8px;border-radius:8px;}
.dateband .wk{font-size:12px;font-weight:400;color:var(--faint);}
/* card */
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--hc,#94a3b8);
  border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow);position:relative;transition:opacity .15s;}
.card.fav{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow);}
.card.done{opacity:.5;}
.crow{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.tg{font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;white-space:nowrap;}
.tg.time{background:var(--ink);color:var(--card);}
.tg.site{background:var(--accent-soft);color:var(--accent-ink);}
.heat{font-size:13px;font-weight:800;color:#fff;padding:6px 11px;border-radius:20px;white-space:nowrap;}
.show{font:800 17px/1.35 "Sora",sans-serif;margin-top:11px;display:flex;align-items:center;flex-wrap:wrap;gap:7px;}
.cat{font-size:11px;font-weight:600;padding:3px 8px;border-radius:7px;}
.sub{margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.city{font-size:13px;color:var(--faint);}
.type{font-size:12px;font-weight:600;padding:4px 10px;border-radius:12px;}
.kw{font-size:11px;font-weight:700;background:#fef3c7;color:#b45309;padding:3px 8px;border-radius:8px;}
.acts{display:flex;gap:7px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line2);flex-wrap:wrap;}
.act{flex:1;min-width:72px;text-align:center;font-size:12px;font-weight:700;padding:8px 6px;border-radius:10px;
  background:var(--chip);color:var(--chip-ink);cursor:pointer;border:1px solid transparent;user-select:none;}
.act.star.on{background:var(--accent);color:#fff;}
.act.grab.on{background:var(--grab);color:#fff;}
.act.skip.on{background:var(--skip);color:#fff;}
.ribbon{position:absolute;top:10px;right:12px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:8px;}
/* overview */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:6px;}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 6px;text-align:center;box-shadow:var(--shadow);}
.tile .n{font:800 24px/1 "Sora",sans-serif;}
.tile .l{font-size:12px;color:var(--muted);margin-top:6px;}
.sect{font:800 16px/1 "Sora",sans-serif;margin:22px 4px 12px;}
.mini{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow);}
.clash{background:var(--card);border:1px solid #fca5a5;border-radius:12px;padding:12px 14px;margin-bottom:9px;}
.clash .h{font-weight:800;color:#dc2626;}
.pchip{display:inline-block;background:var(--card);border:1px solid var(--line);color:var(--chip-ink);
  font-size:12px;font-weight:600;padding:7px 12px;border-radius:11px;margin:0 8px 8px 0;}
.pchip b{color:var(--accent);}
.bar{height:18px;border-radius:5px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;
  text-align:right;line-height:18px;padding-right:8px;min-width:26px;}
/* me tab */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow);}
.panel h3{font-size:15px;margin:0 0 12px;}
.kwin{display:flex;gap:8px;}
.kwin input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:14px;color:var(--ink);}
.kwin button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:0 16px;font-weight:700;font-size:14px;cursor:pointer;}
.taglist{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.rmtag{background:var(--accent-soft);color:var(--accent-ink);font-size:13px;font-weight:600;
  padding:6px 10px;border-radius:10px;cursor:pointer;}
.rmtag:after{content:" ✕";opacity:.6;}
.empty{color:var(--faint);font-size:13px;text-align:center;padding:30px 10px;}
.note{font-size:12px;line-height:1.7;color:var(--muted);}
.note b{color:var(--ink);}
/* calendar (artist+region chips by date) */
.calday{font:800 15px/1 "Sora",sans-serif;margin:18px 4px 11px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.calday .rel{font-size:11px;font-weight:700;color:#fff;background:var(--accent);padding:2px 8px;border-radius:8px;}
.calday .wk{font-size:12px;font-weight:400;color:var(--faint);}
.calday .cnt{font-size:12px;font-weight:600;color:var(--faint);}
.calwrap{display:flex;flex-wrap:wrap;gap:8px;}
.calchip{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
  border-left:4px solid var(--hc,#94a3b8);border-radius:11px;padding:8px 11px;cursor:pointer;box-shadow:var(--shadow);}
.calchip.fav{border-color:var(--accent);background:var(--accent-soft);}
.calchip .nm{font:700 14px/1.2 "Sora",sans-serif;color:var(--ink);}
.calchip .rg{font-size:11px;color:var(--faint);}
.calchip .hd2{font-size:11px;font-weight:800;color:#fff;border-radius:9px;padding:2px 6px;}
.calchip .tm{font-size:11px;color:var(--muted);font-weight:600;}
.calhint{font-size:12px;color:var(--faint);margin:2px 4px 10px;}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);
  border-top:1px solid var(--line);display:flex;
  padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 6px);box-shadow:0 -2px 12px rgba(15,23,42,.05);}
.nav .nb{flex:1;text-align:center;padding:6px 0;cursor:pointer;color:var(--faint);}
.nav .nb .ic{font-size:20px;line-height:1;}
.nav .nb .lb{font-size:11px;font-weight:600;margin-top:3px;}
.nav .nb.on{color:var(--accent);}
.nav .nb .badge{display:inline-block;min-width:16px;font-size:10px;font-weight:800;color:#fff;
  background:#dc2626;border-radius:9px;padding:0 5px;line-height:16px;margin-left:2px;vertical-align:top;}
.legend{font-size:11px;color:var(--muted);line-height:1.9;margin-top:8px;}
/* gate */
.gate{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#111827,#3f34c9);
  display:flex;align-items:center;justify-content:center;padding:24px;}
.gatebox{width:100%;max-width:320px;text-align:center;}
.gatebox .gt{font:800 26px/1.1 "Sora",sans-serif;color:#fff;}
.gatebox .gs{font-size:14px;color:#c7d2fe;margin:10px 0 22px;}
.gatebox input{width:100%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
  color:#fff;font-size:16px;padding:13px 15px;border-radius:12px;text-align:center;}
.gatebox input::placeholder{color:#c7d2fe;}
.gatebox button{width:100%;margin-top:12px;background:#fff;color:#3730a3;border:none;
  font:700 16px/1 "Sora",sans-serif;padding:14px;border-radius:12px;cursor:pointer;}
.gerr{color:#fecaca;font-size:13px;margin-top:12px;}
</style>

/* ---------- access gate ---------- */
var PWHASH="09f6cc80cc778a2cb3acd05457310afc2b93233ec68443da08132bc4e1406076";
async function _sha(s){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0");}).join("");}
(function(){
  var g=document.getElementById("gate"),root=document.getElementById("appRoot");
  function authed(){
    try{if(localStorage.getItem("tr_auth")===PWHASH)return true;}catch(e){}
    if(document.cookie.indexOf("tr_auth="+PWHASH)>=0)return true;
    return false;
  }
  if(authed()){g.hidden=true;root.hidden=false;}
  function pass(){
    try{localStorage.setItem("tr_auth",PWHASH);}catch(e){}
    try{document.cookie="tr_auth="+PWHASH+";path=/;max-age=31536000;SameSite=Lax";}catch(e){}
    g.hidden=true;root.hidden=false;
  }
  document.getElementById("gbtn").onclick=async function(){
    var v=document.getElementById("gpw").value;
    if(await _sha(v)===PWHASH)pass();else document.getElementById("gerr").hidden=false;
  };
  document.getElementById("gpw").addEventListener("keydown",function(e){if(e.key==="Enter")document.getElementById("gbtn").click();});
})();

var REGC={"韩国":"var(--kr)","港澳":"var(--hk)","东南亚":"var(--sea)","台湾":"var(--tw)"};
var EXCLUDED="马尼拉、雅加达、tixcraft、ticketmelon、7-11(曼谷)、ibon、GoLive、Cityline";

function buildEV(rows){return rows.map(function(r){return {id:r[1]+"|"+r[2]+"|"+r[3]+"|"+r[5],
  region:r[0],date:r[1],time:r[2],site:r[3],city:r[4],show:r[5],type:r[6],heat:r[7],cat:CAT[r[5]]||""};});}
var EV=buildEV(RAW);

/* ---------- prefs (localStorage) ---------- */
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var P={follows:load("tr_follows",[]),keywords:load("tr_keywords",[]),
       hidden:load("tr_hidden",[]),marks:load("tr_marks",{})};
function persist(){save("tr_follows",P.follows);save("tr_keywords",P.keywords);
  save("tr_hidden",P.hidden);save("tr_marks",P.marks);}

/* ---------- helpers ---------- */
function heatColor(s){return s>=85?"#e11d48":s>=70?"#f97316":s>=55?"#eab308":s>=45?"#65a30d":"#94a3b8";}
function isFav(e){return P.follows.indexOf(e.show)>=0;}
function kwHit(e){for(var i=0;i<P.keywords.length;i++){var k=P.keywords[i];
  if(k&&((e.show.indexOf(k)>=0)||(e.site.indexOf(k)>=0)||(e.city.indexOf(k)>=0)))return k;}return null;}
function isHidden(e){return P.hidden.indexOf(e.site)>=0||P.hidden.indexOf(e.region)>=0;}
function esc(s){return (s+"").replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}

/* filter state */
var F={region:"全部",sale:"全部",heat:0,showDone:false,date:"全部",q:""};
function matchQ(e){if(!F.q)return true;var q=F.q.toLowerCase();
  return e.show.toLowerCase().indexOf(q)>=0||e.site.toLowerCase().indexOf(q)>=0||
    e.city.toLowerCase().indexOf(q)>=0||e.region.toLowerCase().indexOf(q)>=0||(e.cat&&e.cat.toLowerCase().indexOf(q)>=0);}
var SALES=["全部","公售","预售","会员","优先"];
var HEATS=[[0,"热度不限"],[45,"≥45"],[70,"≥70"],[85,"≥85 重点"]];
var hIdx=0,sIdx=0;

function typeColor(t){return t.indexOf("会员")>=0?["#fef3c7","#b45309"]:
  (t.indexOf("预售")>=0||t.indexOf("优先")>=0)?["#dbeafe","#1d4ed8"]:["#dcfce7","#15803d"];}
function catBadge(e){if(!e.cat)return"";var c=CATC[e.cat]||["#f1f5f9","#64748b"];
  return '<span class="cat" style="background:'+c[0]+';color:'+c[1]+'">'+e.cat+'</span>';}

function cardHTML(e){
  var hc=heatColor(e.heat),fav=isFav(e),kw=kwHit(e),mark=P.marks[e.id];
  var tc=typeColor(e.type);
  var ribbon=mark==="grab"?'<span class="ribbon" style="background:var(--grab);color:#fff">已抢 ✓</span>':
             mark==="skip"?'<span class="ribbon" style="background:var(--skip);color:#fff">已放弃</span>':"";
  return '<div class="card'+(fav?" fav":"")+(mark?" done":"")+'" style="--hc:'+hc+'" data-id="'+e.id+'">'+
    ribbon+
    '<div class="crow"><div class="tags">'+
      '<span class="tg time">'+e.time+'</span>'+
      '<span class="tg site">'+esc(e.site)+'</span>'+
      (kw?'<span class="kw">🔔 '+esc(kw)+'</span>':"")+
    '</div><span class="heat" style="background:'+hc+'">🔥 '+e.heat+'</span></div>'+
    '<div class="show">'+(e.heat>=85?'<span style="color:#e11d48">★</span> ':"")+esc(e.show)+catBadge(e)+'</div>'+
    '<div class="sub"><span class="city">📍 '+esc(e.city)+' · '+esc(e.region)+'</span>'+
      '<span class="type" style="background:'+tc[0]+';color:'+tc[1]+'">'+esc(e.type)+'</span></div>'+
    '<div class="acts">'+
      '<div class="act star'+(fav?" on":"")+'" data-a="star">'+(fav?"★ 已关注":"☆ 关注")+'</div>'+
      '<div class="act grab'+(mark==="grab"?" on":"")+'" data-a="grab">✓ 已抢</div>'+
      '<div class="act skip'+(mark==="skip"?" on":"")+'" data-a="skip">✕ 放弃</div>'+
      '<div class="act" data-a="hide">🚫 隐藏站</div>'+
    '</div></div>';
}

function passFilter(e){
  if(isHidden(e))return false;
  if(!matchQ(e))return false;
  if(F.date!=="全部"&&e.date!==F.date)return false;
  if(F.region!=="全部"&&e.region!==F.region)return false;
  if(F.sale!=="全部"&&e.type.indexOf(F.sale)<0)return false;
  if(e.heat<F.heat)return false;
  if(!F.showDone&&P.marks[e.id])return false;
  return true;
}
function sortKey(a,b){
  return a.date.localeCompare(b.date)||a.time.localeCompare(b.time)||
    a.site.localeCompare(b.site)||a.region.localeCompare(b.region)||
    a.show.localeCompare(b.show)||(b.heat-a.heat);
}

function renderList(target,rows,favFirst){
  var wrap=document.getElementById(target);
  if(!rows.length){wrap.innerHTML='<div class="empty">这里暂时没有符合条件的开票 🎐</div>';return;}
  rows.sort(sortKey);
  var byDate={};rows.forEach(function(e){(byDate[e.date]=byDate[e.date]||[]).push(e);});
  var html="",dates=Object.keys(byDate).sort();
  dates.forEach(function(d){
    var list=byDate[d];
    if(favFirst)list.sort(function(a,b){var fa=isFav(a)||kwHit(a),fb=isFav(b)||kwHit(b);
      if(fa&&!fb)return -1;if(!fa&&fb)return 1;return sortKey(a,b);});
    var r=REL[d]||["",""];
    html+='<div class="dateband">🗓 '+d+' <span class="wk">'+r[1]+'</span>'+(r[0]?'<span class="rel">'+r[0]+'</span>':"")+'</div>';
    list.forEach(function(e){html+=cardHTML(e);});
  });
  wrap.innerHTML=html;
}

function renderMain(){
  var rows=EV.filter(passFilter);
  renderList("viewList",rows,true);
}
function renderFav(){
  var rows=EV.filter(function(e){return (isFav(e)||kwHit(e))&&!isHidden(e);});
  var wrap=document.getElementById("viewFav");
  if(!rows.length){wrap.innerHTML='<div class="empty">还没有关注的艺人或关注词命中。<br>去「开票」页点 ☆ 关注，或在「我的」里加关注词。</div>';return;}
  wrap.innerHTML="";renderList("viewFav",rows,false);
}

function renderCal(){
  var rows=EV.filter(function(e){return !isHidden(e)&&matchQ(e)&&(F.date==="全部"||e.date===F.date)&&(F.region==="全部"||e.region===F.region);});
  var wrap=document.getElementById("viewCal");
  if(!rows.length){wrap.innerHTML='<div class="empty">这里暂时没有开票 🎐</div>';return;}
  rows.sort(sortKey);
  var byDate={};rows.forEach(function(e){(byDate[e.date]=byDate[e.date]||[]).push(e);});
  var html='<div class="calhint">显示「艺人 · 地区」，点一下可快速关注 ⭐；上方可选日期/地区</div>';
  Object.keys(byDate).sort().forEach(function(d){
    var list=byDate[d],r=REL[d]||["",""];
    html+='<div class="calday">🗓 '+d+' <span class="wk">'+r[1]+'</span>'+(r[0]?'<span class="rel">'+r[0]+'</span>':"")+' <span class="cnt">'+list.length+'场</span></div><div class="calwrap">';
    list.forEach(function(e){
      var hc=heatColor(e.heat),fav=isFav(e);
      html+='<div class="calchip'+(fav?" fav":"")+'" style="--hc:'+hc+'" data-id="'+e.id+'">'+
        '<span class="tm">'+e.time+'</span>'+
        '<span class="nm">'+(fav?"★ ":"")+esc(e.show.replace(/（.*）|\(.*\)/,"").trim())+'</span>'+
        '<span class="rg">'+esc(e.city)+'</span>'+
        '<span class="hd2" style="background:'+hc+'">'+e.heat+'</span></div>';
    });
    html+='</div>';
  });
  wrap.innerHTML=html;
}

function buildDateChips(){
  var dates=Array.from(new Set(EV.map(function(e){return e.date;}))).sort();
  var dc=document.getElementById("dateChips");if(!dc)return;
  var html='<div class="chip'+(F.date==="全部"?" on":"")+'" data-d="全部">全部日期</div>';
  dates.forEach(function(d){var r=REL[d]||["",""];html+='<div class="chip'+(F.date===d?" on":"")+'" data-d="'+d+'">'+d+(r[0]?" "+r[0]:"")+'</div>';});
  dc.innerHTML=html;
  dc.querySelectorAll(".chip").forEach(function(c){c.onclick=function(){F.date=c.getAttribute("data-d");buildDateChips();if(VIEW==="cal")renderCal();else renderMain();};});
}

function renderStat(){
  var all=EV.filter(function(e){return !isHidden(e);});
  var total=all.length,key=all.filter(function(e){return e.heat>=85;}).length;
  var byR={};all.forEach(function(e){byR[e.region]=(byR[e.region]||0)+1;});
  var byD={};all.forEach(function(e){byD[e.date]=(byD[e.date]||0)+1;});
  var top=all.slice().sort(function(a,b){return b.heat-a.heat;}).slice(0,5);
  var coll={};all.forEach(function(e){var k=e.date+" "+e.time;(coll[k]=coll[k]||[]).push(e);});
  var clash=Object.keys(coll).filter(function(k){return coll[k].length>=3;})
    .sort(function(a,b){return coll[b].length-coll[a].length||a.localeCompare(b);});
  var byP={};all.forEach(function(e){byP[e.site]=(byP[e.site]||0)+1;});
  var plats=Object.keys(byP).sort(function(a,b){return byP[b]-byP[a]||a.localeCompare(b);});

  var h='<div class="grid">'+
    tile(total,"总场次","var(--ink)")+tile(key,"重点≥85","#e11d48")+tile(byR["韩国"]||0,"韩国","var(--kr)")+
    tile(byR["港澳"]||0,"港澳","var(--hk)")+tile(byR["东南亚"]||0,"东南亚","var(--sea)")+tile(byR["台湾"]||0,"台湾","var(--tw)")+
    '</div>';
  var md=Math.max.apply(null,Object.values(byD).concat([1]));
  h+='<div class="sect">📅 每日场次</div>';
  Object.keys(byD).sort().forEach(function(d){var n=byD[d],r=REL[d]||["",""];
    h+='<div class="mini" style="display:flex;align-items:center;gap:10px"><div style="width:78px;font-size:12px;font-weight:600;color:var(--muted)">'+d+' '+r[0]+'</div>'+
    '<div style="flex:1"><div class="bar" style="width:'+Math.round(n/md*100)+'%">'+n+'</div></div></div>';});

  h+='<div class="sect">🔥 全场最火 TOP5</div>';
  var medal=["🥇","🥈","🥉","4️⃣","5️⃣"];
  top.forEach(function(e,i){h+='<div class="mini" style="display:flex;align-items:center;gap:10px">'+
    '<div style="font-size:19px">'+medal[i]+'</div><div style="flex:1"><div style="font-weight:800;font-size:15px">'+esc(e.show)+catBadge(e)+'</div>'+
    '<div style="font-size:12px;color:var(--faint);margin-top:3px">📍 '+esc(e.city)+' · '+e.date+' '+e.time+' · '+esc(e.site)+'</div></div>'+
    '<span class="heat" style="background:'+heatColor(e.heat)+'">'+e.heat+'</span></div>';});

  if(clash.length){h+='<div class="sect" style="color:#dc2626">⚠️ 撞车时段（同刻多场，需取舍）</div>';
    clash.forEach(function(k){var v=coll[k].slice().sort(function(a,b){return b.heat-a.heat;});
      var names=v.slice(0,3).map(function(e){return e.show;}).join("、")+(v.length>3?" 等"+v.length+"场":"");
      h+='<div class="clash"><span class="h">'+k+' · '+v.length+'场</span><div style="font-size:13px;color:var(--muted);margin-top:6px">'+esc(names)+'</div></div>';});}

  h+='<div class="sect">🏷️ 平台分布 · 提前备号</div><div>';
  plats.forEach(function(p){h+='<span class="pchip">'+esc(p)+' <b>'+byP[p]+'</b></span>';});
  h+='</div>';
  h+='<div class="legend">热度色阶：🔴≥85 爆　🟠70-84 高　🟡55-69 中　🟢45-54 低　⚪&lt;45 冷<br>排序：日期→时间→网站→地区→艺人→票种→热度</div>';
  document.getElementById("viewStat").innerHTML=h;
}
function tile(n,l,c){return '<div class="tile"><div class="n" style="color:'+c+'">'+n+'</div><div class="l">'+l+'</div></div>';}

function renderMe(){
  var marked=EV.filter(function(e){return P.marks[e.id];});
  var h='';
  h+='<div class="panel"><h3>🔔 自定义关注词</h3>'+
    '<div class="kwin"><input id="kwInput" placeholder="如 IU / 演唱会 / KKTIX" maxlength="20"><button id="kwAdd">添加</button></div>'+
    '<div class="taglist" id="kwList"></div>'+
    '<div class="note" style="margin-top:10px">命中演出名/平台/城市的场次会打上 🔔 标记并进入「关注」。</div></div>';
  h+='<div class="panel"><h3>⭐ 我关注的艺人（'+P.follows.length+'）</h3><div class="taglist" id="favList"></div>'+
    (P.follows.length?"":'<div class="note">在「开票」页点卡片的 ☆ 关注即可添加。</div>')+'</div>';
  h+='<div class="panel"><h3>🚫 已隐藏（'+P.hidden.length+'）</h3><div class="taglist" id="hideList"></div>'+
    (P.hidden.length?"":'<div class="note">在卡片上点「隐藏站」可隐藏该平台。</div>')+'</div>';
  h+='<div class="panel"><h3>🗂 已标记（'+marked.length+'）</h3>'+
    (marked.length?marked.map(function(e){return '<div style="font-size:13px;padding:6px 0;border-bottom:1px solid var(--line2)">'+
      (P.marks[e.id]==="grab"?'<b style="color:var(--grab)">已抢</b>':'<b style="color:var(--skip)">放弃</b>')+
      ' · '+e.date+' '+e.time+' '+esc(e.show)+'</div>';}).join(""):'<div class="note">卡片上点「已抢/放弃」标记。</div>')+'</div>';
  h+='<div class="panel"><h3>ℹ️ 说明</h3><div class="note">'+
    '<b>数据</b>：'+esc(META.updated)+'，每日自动抓取更新。<br>'+
    '<b>时间</b>：均为中国时间（UTC+8）。<br>'+
    '<b>已排除</b>：'+EXCLUDED+'。<br>'+
    '<b>通知</b>：关注命中的开票会通过邮件/微信推送提醒。</div></div>';
  var box=document.getElementById("viewMe");box.innerHTML=h;

  var kl=document.getElementById("kwList");
  kl.innerHTML=P.keywords.map(function(k){return '<span class="rmtag" data-rk="'+esc(k)+'">'+esc(k)+'</span>';}).join("")||'<span class="note">暂无</span>';
  var fl=document.getElementById("favList");
  fl.innerHTML=P.follows.map(function(k){return '<span class="rmtag" data-rf="'+esc(k)+'">'+esc(k)+'</span>';}).join("");
  var hl=document.getElementById("hideList");
  hl.innerHTML=P.hidden.map(function(k){return '<span class="rmtag" data-rh="'+esc(k)+'">'+esc(k)+'</span>';}).join("");

  document.getElementById("kwAdd").onclick=function(){var v=document.getElementById("kwInput").value.trim();
    if(v&&P.keywords.indexOf(v)<0){P.keywords.push(v);persist();refresh();}};
  document.getElementById("kwInput").addEventListener("keydown",function(e){if(e.key==="Enter")document.getElementById("kwAdd").onclick();});
  box.querySelectorAll("[data-rk]").forEach(function(el){el.onclick=function(){P.keywords=P.keywords.filter(function(x){return x!==el.getAttribute("data-rk");});persist();refresh();};});
  box.querySelectorAll("[data-rf]").forEach(function(el){el.onclick=function(){P.follows=P.follows.filter(function(x){return x!==el.getAttribute("data-rf");});persist();refresh();};});
  box.querySelectorAll("[data-rh]").forEach(function(el){el.onclick=function(){P.hidden=P.hidden.filter(function(x){return x!==el.getAttribute("data-rh");});persist();refresh();};});
}

function updBadge(){var n=EV.filter(function(e){return (isFav(e)||kwHit(e))&&!isHidden(e)&&!P.marks[e.id];}).length;
  var b=document.getElementById("favBadge");if(n){b.textContent=n;b.hidden=false;}else b.hidden=true;}

var VIEW="list";
function refresh(){
  document.getElementById("range").textContent=META.range+" · 中国时间";
  document.getElementById("upd").textContent="更新："+META.updated;
  if(VIEW==="list")renderMain();
  else if(VIEW==="cal")renderCal();
  else if(VIEW==="fav")renderFav();
  else if(VIEW==="stat")renderStat();
  else if(VIEW==="me")renderMe();
  updBadge();
}
function switchView(v){
  VIEW=v;
  ["list","cal","fav","stat","me"].forEach(function(x){document.getElementById("view"+x.charAt(0).toUpperCase()+x.slice(1)).hidden=(x!==v);});
  document.querySelectorAll(".nav .nb").forEach(function(nb){nb.classList.toggle("on",nb.getAttribute("data-v")===v);});
  document.getElementById("fbBar").hidden=(v!=="list"&&v!=="cal");
  refresh();
  window.scrollTo(0,0);
}

/* events */
document.querySelectorAll(".nav .nb").forEach(function(nb){nb.onclick=function(){switchView(nb.getAttribute("data-v"));};});

document.getElementById("regionChips");
function buildRegionChips(){
  var rc=document.getElementById("regionChips");var regs=["全部","韩国","港澳","东南亚","台湾"];
  rc.innerHTML=regs.map(function(r){return '<div class="chip'+(r===F.region?" on":"")+'" data-r="'+r+'">'+r+'</div>';}).join("");
  rc.querySelectorAll(".chip").forEach(function(c){c.onclick=function(){F.region=c.getAttribute("data-r");buildRegionChips();renderMain();};});
}
document.getElementById("tSale").onclick=function(){sIdx=(sIdx+1)%SALES.length;F.sale=SALES[sIdx];
  this.textContent=sIdx===0?"全部票种":SALES[sIdx];this.classList.toggle("on",sIdx!==0);renderMain();};
document.getElementById("tHeat").onclick=function(){hIdx=(hIdx+1)%HEATS.length;F.heat=HEATS[hIdx][0];
  this.textContent=HEATS[hIdx][1];this.classList.toggle("on",hIdx!==0);renderMain();};
document.getElementById("tHideDone").onclick=function(){F.showDone=!F.showDone;
  this.textContent=F.showDone?"隐藏已处理":"显示已处理";this.classList.toggle("on",F.showDone);renderMain();};
(function(){var si=document.getElementById("searchInput"),sc=document.getElementById("searchClear");
  function apply(){F.q=si.value.trim();sc.hidden=!F.q;if(VIEW==="cal")renderCal();else renderMain();}
  si.addEventListener("input",apply);
  sc.onclick=function(){si.value="";F.q="";sc.hidden=true;si.focus();if(VIEW==="cal")renderCal();else renderMain();};
})();

/* card action delegation */
document.querySelector(".wrap").addEventListener("click",function(ev){
  var chip=ev.target.closest(".calchip");
  if(chip){var e2=EV.filter(function(x){return x.id===chip.getAttribute("data-id");})[0];
    if(e2){var j=P.follows.indexOf(e2.show);if(j>=0)P.follows.splice(j,1);else P.follows.push(e2.show);persist();refresh();}return;}
  var act=ev.target.closest(".act");if(!act)return;
  var card=ev.target.closest(".card");if(!card)return;
  var id=card.getAttribute("data-id"),e=EV.filter(function(x){return x.id===id;})[0];if(!e)return;
  var a=act.getAttribute("data-a");
  if(a==="star"){var i=P.follows.indexOf(e.show);if(i>=0)P.follows.splice(i,1);else P.follows.push(e.show);}
  else if(a==="grab"){P.marks[e.id]=P.marks[e.id]==="grab"?undefined:"grab";if(!P.marks[e.id])delete P.marks[e.id];}
  else if(a==="skip"){P.marks[e.id]=P.marks[e.id]==="skip"?undefined:"skip";if(!P.marks[e.id])delete P.marks[e.id];}
  else if(a==="hide"){if(P.hidden.indexOf(e.site)<0)P.hidden.push(e.site);}
  persist();refresh();
});

buildRegionChips();
buildDateChips();
switchView("list");

/* 每日自动抓取会覆盖 events.json；有就用最新数据 */
fetch("events.json?_="+Date.now()).then(function(r){return r.ok?r.json():null;}).then(function(d){
  if(d&&d.events&&d.events.length){EV=buildEV(d.events);
    if(d.range)META.range=d.range;if(d.updated)META.updated=d.updated;buildDateChips();refresh();}
}).catch(function(){});
</script>
</body>
</html>
